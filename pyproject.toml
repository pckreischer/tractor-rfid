[project]
name = "tractor-rfid"
version = "0.1.0"
description = "Dynamic macro engine for entering seed/chemical data into John Deere displays"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
desktop = ["pyautogui>=0.9.54"]
dev = ["pytest>=8.0"]

[project.scripts]
jdmacro = "tractor_rfid.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
